services:
  moneta-fx:
    build: .
    ports:
      - "4173:4173"
    environment:
      MONETA_HOST: 0.0.0.0
      MONETA_PORT: "4173"
      MONETA_DATA_DIR: /data
      # 上线前必须修改
      MONETA_DEVELOPER_KEY: "change-me-developer-key"
      MONETA_ADMIN_PASSWORD: "change-me-admin-password"
      MONETA_INITIAL_BALANCE: "100000"
      MONETA_TICK_MS: "250"
      MONETA_PERSIST_MS: "5000"
      # 如有对外域名（含隧道转发），取消注释并填写
      # MONETA_PUBLIC_DOMAIN: "fx.example.com"
    volumes:
      - moneta-data:/data
    restart: unless-stopped

volumes:
  moneta-data:
